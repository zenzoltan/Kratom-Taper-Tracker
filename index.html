<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Daily Log</title>
    <meta name="apple-mobile-web-app-title" content="Daily Log">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23181818'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23333333' stroke-width='28'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%234a90e2' stroke-width='28' stroke-dasharray='700' stroke-dashoffset='220' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='256' r='36' fill='%23ffffff'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      [v-cloak] {
        display: none;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px;
        background: #121212;
        color: #e0e0e0;
        margin: 0;
        max-width: 460px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.4;
      }
      .error-banner {
        background: #2b1414;
        border: 1px solid #6b2424;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        font-size: 12px;
        color: #ffcdd2;
      }
      .error-banner-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .error-code {
        font-weight: 700;
        color: #ef5350;
        font-family: monospace;
      }
      .error-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .error-btn {
        background: #3d1d1d;
        color: #ffcdd2;
        border: none;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .error-btn:active {
        background: #522727;
      }
      .error-msg-text {
        margin-top: 4px;
        word-break: break-word;
        color: #e0b0b0;
      }
      .top-row {
        display: flex;
        align-items: flex-end;
        gap: 5px;
        margin-bottom: 8px;
      }
      .form-group {
        flex: 1;
        min-width: 0;
      }
      .settings-btn {
        background: #1c1c1c;
        color: #888;
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: color 0.15s, background 0.15s;
      }
      .settings-btn:active {
        background: #282828;
        color: #fff;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      input, select {
        width: 100%;
        height: 36px;
        padding: 0 6px;
        background: #1c1c1c;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        box-sizing: border-box;
      }
      input:focus, select:focus {
        outline: none;
      }
      .time-input {
        text-align: center;
      }
      .day-type-container {
        display: flex;
        margin-bottom: 12px;
        background: #181818;
        border: none;
        border-radius: 8px;
        padding: 4px;
        gap: 4px;
      }
      .day-type-btn {
        flex: 1;
        padding: 8px 10px;
        background: transparent;
        color: #777;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .day-type-btn.active {
        background: #282828;
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      }
      .dose-container {
        margin: 10px 0 6px 0;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .dose-container:active {
        background: #202020;
      }
      .dose-input {
        width: 100%;
        max-width: 160px;
        height: auto;
        padding: 10px;
        font-size: 32px;
        font-weight: 600;
        text-align: center;
        background: #0f0f0f;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        outline: none;
        margin: 0 auto;
        display: block;
        cursor: text;
        transition: box-shadow 0.2s;
      }
      .preview-box {
        margin-top: 10px;
        padding: 8px 10px;
        background: #1e251e;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        color: #a5d6a7;
        text-align: left;
        pointer-events: none;
      }
      .preview-grid {
        display: flex;
        justify-content: space-between;
      }
      .preview-item {
        font-weight: 600;
      }
      .card {
        margin-top: 12px;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #202020;
        font-size: 13px;
      }
      .stat-row:last-child {
        border-bottom: none;
      }
      .stat-label {
        color: #888;
      }
      .stat-value {
        font-weight: 600;
        color: #fff;
      }
      .loading {
        color: #666;
        font-style: italic;
        font-size: 12px;
        text-align: center;
        padding: 8px 0;
      }
      .doses-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2px;
      }
      .doses-table td {
        padding: 5px 3px 6px 3px;
        border: none;
      }
      .table-input {
        width: 100%;
        height: auto;
        padding: 6px 4px;
        background: #121212;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        text-align: center;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 16px;
      }
      .modal-box {
        background: #181818;
        border: 1px solid #282828;
        border-radius: 14px;
        padding: 18px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      }
      .modal-box-wide {
        max-width: 420px;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .modal-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        font-weight: 700;
        color: #aaa;
      }
      .modal-close {
        background: transparent;
        border: none;
        color: #777;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 6px;
      }
      .modal-section {
        margin-bottom: 16px;
      }
      .slider-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .slider-value {
        font-size: 14px;
        font-weight: 700;
        color: #64b5f6;
      }
      .settings-slider {
        width: 100%;
        height: auto;
        padding: 0;
        background: transparent;
        accent-color: #64b5f6;
        cursor: pointer;
      }
      .modal-inputs-row {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .modal-input-block {
        flex: 1;
        background: #121212;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
      }
      .modal-input-block label {
        margin-bottom: 6px;
        text-align: center;
      }
      .modal-num-input {
        width: 100%;
        height: auto;
        background: #1c1c1c;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        padding: 8px 6px;
        border-radius: 8px;
      }
      .modal-secondary-btn {
        width: 100%;
        margin-bottom: 8px;
        padding: 10px;
        background: #121212;
        color: #64b5f6;
        border: 1px solid #262626;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .modal-secondary-btn:active {
        background: #1f1f1f;
      }
      .modal-save-btn {
        width: 100%;
        padding: 10px;
        background: #282828;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .modal-save-btn:active {
        background: #333;
      }
      .range-tabs {
        display: flex;
        background: #121212;
        border-radius: 8px;
        padding: 3px;
        gap: 3px;
        margin-bottom: 8px;
      }
      .range-tab {
        flex: 1;
        padding: 6px 8px;
        background: transparent;
        color: #777;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .range-tab.active {
        background: #282828;
        color: #fff;
      }
      .stats-summary-bar {
        display: flex;
        justify-content: space-between;
        background: #121212;
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .stats-summary-item span {
        color: #777;
        margin-right: 4px;
      }
      .stats-summary-item strong {
        color: #fff;
      }
      .chart-container {
        width: 100%;
        height: 190px;
        background: #121212;
        border-radius: 10px;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }
      .chart-empty {
        color: #666;
        font-size: 12px;
        text-align: center;
      }
      .stats-compare-box {
        background: #121212;
        border-radius: 10px;
        padding: 8px 12px;
      }
      .compare-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
        border-bottom: 1px solid #1e1e1e;
        font-size: 12px;
      }
      .compare-row:last-child {
        border-bottom: none;
      }
      .compare-label {
        color: #888;
      }
      .compare-vals {
        display: flex;
        gap: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app" v-cloak>
      <!-- Exposed Error Banner -->
      <div v-if="activeError" class="error-banner">
        <div class="error-banner-top">
          <span class="error-code">[{{ activeError.code }}]</span>
          <div class="error-actions">
            <button type="button" class="error-btn" @click="copyErrorReport">{{ copyFeedback || 'Copy' }}</button>
            <button type="button" class="error-btn" @click="dismissError">×</button>
          </div>
        </div>
        <div class="error-msg-text">{{ activeError.message }}</div>
      </div>

      <!-- Top Row -->
      <div class="top-row">
        <div class="form-group" style="flex: 0 0 62px;">
          <label for="sheetName">Profile</label>
          <select id="sheetName" v-model="sheetName" @change="onProfileChange">
            <option value="Kori">Kori</option>
            <option value="Zoli">Zoli</option>
          </select>
        </div>
        <div class="form-group">
          <label for="doseDate">Date</label>
          <input type="date" id="doseDate" v-model="doseDate" @change="loadStats" required>
        </div>
        <div class="form-group" style="flex: 0 0 58px;">
          <label for="wakeTime">Wake</label>
          <input
            type="text"
            id="wakeTime"
            class="time-input"
            placeholder="07:00"
            maxlength="5"
            inputmode="numeric"
            enterkeyhint="done"
            :value="wakeTime"
            @input="onWakeInput"
            @keydown.enter.prevent="$event.target.blur()"
            @blur="onWakeBlur"
          >
        </div>
        <div class="form-group" style="flex: 0 0 58px;">
          <label for="time">Time</label>
          <input
            type="text"
            id="time"
            class="time-input"
            placeholder="08:20"
            maxlength="5"
            inputmode="numeric"
            enterkeyhint="done"
            :value="time"
            @input="onManualTimeInput"
            @keydown.enter.prevent="$event.target.blur()"
            @blur="onTimeBlur"
            required
          >
        </div>
        <button type="button" class="settings-btn" @click="openSettingsModal" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l
