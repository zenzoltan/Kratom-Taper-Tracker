<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Daily Log</title>
    <meta name="apple-mobile-web-app-title" content="Daily Log">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23181818'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23333333' stroke-width='28'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%234a90e2' stroke-width='28' stroke-dasharray='700' stroke-dashoffset='220' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='256' r='36' fill='%23ffffff'/%3E%3C/svg%3E">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px;
        background: #121212;
        color: #e0e0e0;
        margin: 0;
        max-width: 460px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.4;
      }
      .top-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .form-group {
        flex: 1;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      input, select {
        width: 100%;
        padding: 9px 8px;
        background: #1c1c1c;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        box-sizing: border-box;
      }
      input:focus, select:focus {
        outline: none;
      }

      .day-type-container {
        display: flex;
        margin-bottom: 12px;
        background: #181818;
        border: none;
        border-radius: 8px;
        padding: 4px;
        gap: 4px;
      }
      .day-type-btn {
        flex: 1;
        padding: 8px 10px;
        background: transparent;
        color: #777;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .day-type-btn.active {
        background: #282828;
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      }

      .dose-container {
        margin: 10px 0 6px 0;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .dose-container:active {
        background: #202020;
      }

      .dose-input {
        width: 100%;
        max-width: 160px;
        padding: 10px;
        font-size: 32px;
        font-weight: 600;
        text-align: center;
        background: #0f0f0f;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        outline: none;
        margin: 0 auto;
        display: block;
        cursor: text;
        transition: box-shadow 0.2s;
      }
      .dose-input:focus {
        outline: none;
      }

      .preview-box {
        display: none;
        margin-top: 10px;
        padding: 8px 10px;
        background: #1e251e;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        color: #a5d6a7;
        text-align: left;
        pointer-events: none;
      }
      .preview-grid {
        display: flex;
        justify-content: space-between;
      }
      .preview-item {
        font-weight: 600;
      }

      #statusMsg {
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        min-height: 20px;
        margin: 6px 0;
      }
      .status-idle { color: transparent; }
      .status-saving { color: #d1a153; }
      .status-success { color: #7cb342; }
      .status-error { color: #e57373; }

      .card {
        margin-top: 12px;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
      }
      .card-header {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 700;
        color: #888;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card-header-noborder {
        border-bottom: none;
        padding-bottom: 0px;
        margin-bottom: 4px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #202020;
        font-size: 13px;
      }
      .stat-row:last-child {
        border-bottom: none;
      }
      .stat-label {
        color: #888;
      }
      .stat-value {
        font-weight: 600;
        color: #fff;
      }
      .highlight-value {
        color: #64b5f6;
        font-weight: 700;
      }
      .loading {
        color: #666;
        font-style: italic;
        font-size: 12px;
        text-align: center;
        padding: 8px 0;
      }

      .doses-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2px;
      }
      .doses-table td {
        padding: 5px 3px 6px 3px;
        border: none;
      }
      .table-input {
        width: 100%;
        padding: 6px 4px;
        background: #121212;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        text-align: center;
      }
      .table-input:focus {
        outline: none;
      }
    </style>
  </head>
  <body>

    <div class="top-row">
      <div class="form-group" style="max-width: 75px;">
        <label for="sheetName">Profile</label>
        <select id="sheetName" onchange="onProfileChange()">
          <option value="Kori">Kori</option>
          <option value="Zoli">Zoli</option>
        </select>
      </div>
      <div class="form-group">
        <label for="doseDate">Date</label>
        <input type="date" id="doseDate" onchange="loadStats()" required>
      </div>
      <div class="form-group" style="max-width: 82px;">
        <label for="wakeTime">Wake</label>
        <input 
          type="text" 
          id="wakeTime" 
          placeholder="07:00" 
          maxlength="5" 
          inputmode="numeric" 
          enterkeyhint="done"
          oninput="formatTimeInput(this)" 
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
          onblur="onWakeTimeBlur(this)"
        >
      </div>
      <div class="form-group" style="max-width: 82px;">
        <label for="time">Time</label>
        <input 
          type="text" 
          id="time" 
          placeholder="08:20" 
          maxlength="5" 
          inputmode="numeric" 
          enterkeyhint="done"
          oninput="onUserManualTimeInput(this)" 
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
          onblur="normalizeTimeField(this); onTimeChange();" 
          required
        >
      </div>
    </div>

    <div id="dayTypeContainer" class="day-type-container">
      <button type="button" id="btnSzabadnap" class="day-type-btn active" onclick="setDayType('Szabadnap')">Off</button>
      <button type="button" id="btnMunkanap" class="day-type-btn" onclick="setDayType('Munkanap')">Work</button>
    </div>

    <form id="mainDoseForm" onsubmit="event.preventDefault(); autoSubmit();" class="dose-container" onclick="handleDoseContainerClick(event)">
      <input 
        type="text" 
        id="amount" 
        class="dose-input" 
        placeholder="0.00" 
        inputmode="numeric" 
        enterkeyhint="done"
        onclick="event.stopPropagation();"
        oninput="formatAmountInput(this); onUserTyping();"
        onkeydown="handleKey(event)"
        onblur="handleBlur()"
      >
      <div id="livePreviewBox" class="preview-box">
        <div class="preview-grid">
          <div>Total: <span id="prevTotal" class="preview-item">-</span></div>
          <div>Diff: <span id="prevDiff" class="preview-item">-</span></div>
          <div>Rate: <span id="prevRateDisplay" class="preview-item">-</span></div>
        </div>
      </div>
    </form>

    <div class="card">
      <div class="card-header">
        <span>Latest</span>
        <span id="lastDoseTimeLabel" style="color: #64b5f6;"></span>
      </div>
      <div id="lastDoseStatsContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>Values</span>
        <span id="dateSubtitle" style="color: #555;"></span>
      </div>
      <div id="summaryStatsContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header card-header-noborder">
        <span>Entries</span>
      </div>
      <div id="editableDosesContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <script>
      const APPS_SCRIPT_
