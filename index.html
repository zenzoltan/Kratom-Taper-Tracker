<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Daily Log</title>
    <meta name="apple-mobile-web-app-title" content="Daily Log">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23181818'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23333333' stroke-width='28'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%234a90e2' stroke-width='28' stroke-dasharray='700' stroke-dashoffset='220' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='256' r='36' fill='%23ffffff'/%3E%3C/svg%3E">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 16px;
        background: #121212;
        color: #e0e0e0;
        margin: 0;
        max-width: 460px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.4;
      }
      .top-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .form-group {
        flex: 1;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #777;
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      input, select {
        width: 100%;
        padding: 9px 8px;
        background: #1c1c1c;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        box-sizing: border-box;
      }
      input:focus, select:focus {
        outline: none;
      }

      .day-type-container {
        display: none;
        margin-bottom: 12px;
        background: #181818;
        border: none;
        border-radius: 8px;
        padding: 4px;
        gap: 4px;
      }
      .day-type-btn {
        flex: 1;
        padding: 8px 10px;
        background: transparent;
        color: #777;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .day-type-btn.active {
        background: #282828;
        color: #ffffff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      }

      .dose-container {
        margin: 10px 0 6px 0;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .dose-container:active {
        background: #202020;
      }

      .dose-input {
        width: 100%;
        max-width: 160px;
        padding: 10px;
        font-size: 32px;
        font-weight: 600;
        text-align: center;
        background: #0f0f0f;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        outline: none;
        margin: 0 auto;
        display: block;
        cursor: text;
        transition: box-shadow 0.2s;
      }
      .dose-input:focus {
        outline: none;
      }

      .preview-box {
        display: none;
        margin-top: 10px;
        padding: 8px 10px;
        background: #1e251e;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        color: #a5d6a7;
        text-align: left;
        pointer-events: none;
      }
      .preview-grid {
        display: flex;
        justify-content: space-between;
      }
      .preview-item {
        font-weight: 600;
      }

      .card {
        margin-top: 12px;
        background: #181818;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
      }
      .card-header {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 700;
        color: #888;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card-header-noborder {
        border-bottom: none;
        padding-bottom: 0px;
        margin-bottom: 4px;
      }

      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #202020;
        font-size: 13px;
      }
      .stat-row:last-child {
        border-bottom: none;
      }
      .stat-label {
        color: #888;
      }
      .stat-value {
        font-weight: 600;
        color: #fff;
      }
      .highlight-value {
        color: #64b5f6;
        font-weight: 700;
      }
      .loading {
        color: #666;
        font-style: italic;
        font-size: 12px;
        text-align: center;
        padding: 8px 0;
      }

      .doses-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2px;
      }
      .doses-table td {
        padding: 5px 3px 6px 3px;
        border: none;
      }
      .table-input {
        width: 100%;
        padding: 6px 4px;
        background: #121212;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        text-align: center;
      }
      .table-input:focus {
        outline: none;
      }
    </style>
  </head>
  <body>

    <div class="top-row">
      <div class="form-group" style="max-width: 75px;">
        <label for="sheetName">Profile</label>
        <select id="sheetName" onchange="onProfileChange()">
          <option value="Kori">Kori</option>
          <option value="Zoli">Zoli</option>
        </select>
      </div>
      <div class="form-group">
        <label for="doseDate">Date</label>
        <input type="date" id="doseDate" onchange="loadStats()" required>
      </div>
      <div class="form-group" style="max-width: 82px;">
        <label for="wakeTime">Wake</label>
        <input 
          type="text" 
          id="wakeTime" 
          placeholder="07:00" 
          maxlength="5" 
          inputmode="numeric" 
          enterkeyhint="done"
          oninput="formatTimeInput(this)" 
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
          onblur="onWakeTimeBlur(this)"
        >
      </div>
      <div class="form-group" style="max-width: 82px;">
        <label for="time">Time</label>
        <input 
          type="text" 
          id="time" 
          placeholder="08:20" 
          maxlength="5" 
          inputmode="numeric" 
          enterkeyhint="done"
          oninput="onUserManualTimeInput(this)" 
          onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
          onblur="normalizeTimeField(this); onTimeChange();" 
          required
        >
      </div>
    </div>

    <div id="dayTypeContainer" class="day-type-container">
      <button type="button" id="btnSzabadnap" class="day-type-btn active" onclick="setDayType('Szabadnap')">Off</button>
      <button type="button" id="btnMunkanap" class="day-type-btn" onclick="setDayType('Munkanap')">Work</button>
    </div>

    <form id="mainDoseForm" onsubmit="event.preventDefault(); autoSubmit();" class="dose-container" onclick="handleDoseContainerClick(event)">
      <input 
        type="text" 
        id="amount" 
        class="dose-input" 
        placeholder="0.00" 
        inputmode="numeric" 
        enterkeyhint="done"
        onclick="event.stopPropagation();"
        oninput="formatAmountInput(this); onUserTyping();"
        onkeydown="handleKey(event)"
        onblur="handleBlur()"
      >
      <div id="livePreviewBox" class="preview-box">
        <div class="preview-grid">
          <div>Total: <span id="prevTotal" class="preview-item">-</span></div>
          <div>Diff: <span id="prevDiff" class="preview-item">-</span></div>
          <div>Rate: <span id="prevRateDisplay" class="preview-item">-</span></div>
        </div>
      </div>
    </form>

    <div class="card">
      <div class="card-header">
        <span>Latest</span>
        <span id="lastDoseTimeLabel" style="color: #64b5f6;"></span>
      </div>
      <div id="lastDoseStatsContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>Values</span>
        <span id="dateSubtitle" style="color: #555;"></span>
      </div>
      <div id="summaryStatsContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header card-header-noborder">
        <span>Entries</span>
      </div>
      <div id="editableDosesContent">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4Hia9jVs004hj9k1coJoTHy_o5Q02YDrroWzILJ3a_pjFB8p9dCOLy4DABNOIl-M/exec";
      var isSaving = false;
      var lastRecordedTimeStr = null;
      var currentStatsData = null;
      var isUserModified = false;
      var isManualTimeSet = false;
      var activeDayType = 'Szabadnap';

      function getDoseCap(dateStr) {
        var base = new Date(2026, 10, 10);
        var parts = (dateStr || '').split('-');
        if (parts.length === 3) {
          var cur = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          var diffDays = Math.floor((cur.getTime() - base.getTime()) / (1000 * 60 * 60 * 24));
          if (diffDays > 0) {
            var steps = Math.floor(diffDays / 2);
            return Math.max(0.1, 3.67 - (steps * 0.01));
          }
        }
        return 3.67;
      }

      function formatTimeInput(el) {
        var val = el.value.replace(/[^0-9]/g, '');
        if (val.length >= 3) {
          el.value = val.substring(0, 2) + ':' + val.substring(2, 4);
        } else {
          el.value = val;
        }
      }

      function onTableTimeInputAuto(el, doseNum) {
        var digits = el.value.replace(/[^0-9]/g, '');
        if (digits.length >= 3) {
          el.value = digits.substring(0, 2) + ':' + digits.substring(2, 4);
        } else {
          el.value = digits;
        }

        if (digits.length >= 4) {
          var aEl = document.getElementById('t_amount_' + doseNum);
          if (aEl) {
            setTimeout(function() {
              aEl.focus();
              aEl.select();
            }, 30);
          }
        }
      }

      function onUserManualTimeInput(el) {
        isManualTimeSet = true;
        formatTimeInput(el);
        onTimeChange();
      }

      function normalizeTimeField(el) {
        var val = el.value.trim();
        if (!val) return;
        var digits = val.replace(/[^0-9]/g, '');
        if (digits.length === 1 || digits.length === 2) {
          var h = parseInt(digits, 10);
          el.value = (h < 10 ? '0' + h : h) + ':00';
        } else if (digits.length === 3) {
          var h = parseInt(digits.substring(0, 1), 10);
          var m = digits.substring(1, 3);
          el.value = '0' + h + ':' + m;
        } else if (digits.length >= 4) {
          el.value = digits.substring(0, 2) + ':' + digits.substring(2, 4);
        }
      }

      function onWakeTimeBlur(el) {
        normalizeTimeField(el);
        onWakeTimeChange();
      }

      function formatAmountInput(el) {
        var raw = el.value;
        var isNeg = raw.startsWith('-');
        var digits = raw.replace(/[^0-9]/g, '');
        if (!digits) {
          el.value = isNeg ? '-' : '';
          return;
        }
        var formatted = '';
        if (digits.length === 1) {
          formatted = digits;
        } else {
          formatted = digits.substring(0, 1) + ',' + digits.substring(1, 3);
        }
        el.value = (isNeg ? '-' : '') + formatted;
      }

      function callApi(params, onSuccess, onError) {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          onSuccess(data);
        };

        const queryParams = Object.keys(params)
          .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
          .join('&');

        const script = document.createElement('script');
        script.src = `${APPS_SCRIPT_URL}?${queryParams}&callback=${callbackName}&_ts=${Date.now()}`;
        script.onerror = function() {
          delete window[callbackName];
          if (script && script.parentNode) script.parentNode.removeChild(script);
          if (onError) onError(new Error("Failed to reach server"));
        };
        document.body.appendChild(script);
      }

      window.onload = function() {
        var savedProfile = localStorage.getItem('taper_active_profile') || 'Kori';
        document.getElementById('sheetName').value = savedProfile;

        updateDayTypeVisibility(savedProfile);
        resetDateTime();
        loadStats();

        setInterval(syncClockToLiveTime, 1000);
        setInterval(updateLiveElapsedTime, 15000);
      };

      function syncClockToLiveTime() {
        if (isManualTimeSet || document.activeElement === document.getElementById('time')) return;

        var now = new Date();
        var currentFormattedTime = now.toTimeString().substring(0, 5);
        var timeInput = document.getElementById('time');

        if (timeInput && timeInput.value !== currentFormattedTime) {
          timeInput.value = currentFormattedTime;
          if (!isUserModified && currentStatsData) {
            applyDoseRecommendation(currentStatsData);
          } else {
            onTimeOrAmountInput();
          }
        }
      }

      function updateDayTypeVisibility(profile) {
        var container = document.getElementById('dayTypeContainer');
        if (profile === 'Kori') {
          container.style.display = 'flex';
        } else {
          container.style.display = 'none';
        }
      }

      function onProfileChange() {
        var profile = document.getElementById('sheetName').value;
        localStorage.setItem('taper_active_profile', profile);
        
        updateDayTypeVisibility(profile);

        currentStatsData = null;
        isUserModified = false;
        isManualTimeSet = false;
        document.getElementById('livePreviewBox').style.display = 'none';
        document.getElementById('amount').value = '';

        loadStats();
      }

      function setDayType(type) {
        activeDayType = type;
        document.getElementById('btnSzabadnap').className = 'day-type-btn' + (type === 'Szabadnap' ? ' active' : '');
        document.getElementById('btnMunkanap').className = 'day-type-btn' + (type === 'Munkanap' ? ' active' : '');

        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;

        callApi({
          action: 'saveDayType',
          sheetName: sheetName,
          dateStr: dateStr,
          dayType: type
        }, function(res) {
          if (res && res.success) {
            saveToLocalCache(sheetName, dateStr, res.stats);
            renderAllStats(res.stats);
          }
        }, function(err) {});
      }

      function resetDateTime() {
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var dd = String(today.getDate()).padStart(2, '0');
        
        document.getElementById('doseDate').value = yyyy + '-' + mm + '-' + dd;
        document.getElementById('time').value = today.toTimeString().substring(0, 5);
        isManualTimeSet = false;
      }

      function handleDoseContainerClick(event) {
        if (event.target === document.getElementById('amount')) return;

        var amountVal = getParsedAmount(document.getElementById('amount').value);
        if (amountVal > 0 && !isSaving) {
          autoSubmit();
        }
      }

      function handleKey(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          autoSubmit();
        }
      }

      function handleBlur() {
        setTimeout(function() {
          var rawVal = document.getElementById('amount').value.trim();
          var val = getParsedAmount(rawVal);
          if (val > 0 && !isSaving && isUserModified) {
            autoSubmit();
          }
        }, 150);
      }

      function onUserTyping() {
        isUserModified = true;
        onTimeOrAmountInput();
      }

      function onTimeChange() {
        if (!isUserModified && currentStatsData) {
          applyDoseRecommendation(currentStatsData);
        } else {
          onTimeOrAmountInput();
        }
      }

      function getParsedAmount(rawVal) {
        if (!rawVal) return 0;
        var normalized = String(rawVal).replace(',', '.').trim();
        var num = parseFloat(normalized);
        return isNaN(num) ? 0 : num;
      }

      function getIntervalHoursToNow(data) {
        var currentTime = document.getElementById('time').value.trim();
        if (!currentTime || currentTime.indexOf(':') === -1) return null;

        var last = data.lastDose;
        var prevTime = null;

        if (last && last.time) {
          prevTime = last.time;
        } else {
          prevTime = document.getElementById('wakeTime').value.trim();
        }

        if (!prevTime || prevTime.indexOf(':') === -1) return null;

        var p1 = prevTime.split(':');
        var p2 = currentTime.split(':');
        var min1 = parseInt(p1[0], 10) * 60 + parseInt(p1[1], 10);
        var min2 = parseInt(p2[0], 10) * 60 + parseInt(p2[1], 10);
        
        var diffMin = min2 - min1;

        if (diffMin < 0) {
          if (Math.abs(diffMin) <= 3) {
            diffMin = 0;
          } else {
            diffMin += 1440;
          }
        }

        return diffMin / 60;
      }

      function applyDoseRecommendation(data) {
        if (!data || !data.found || isUserModified) return;

        var currentRecordedCount = 0;
        if (data.allDoses) {
          for (var d = 0; d < data.allDoses.length; d++) {
            if (data.allDoses[d].hasData) currentRecordedCount++;
          }
        }
        var nextDoseNum = currentRecordedCount + 1;
        if (nextDoseNum > 8) return;

        var yMap = data.yesterdayRates;
        var baselineRate = (yMap && yMap[nextDoseNum] !== undefined) ? parseFloat(yMap[nextDoseNum]) : 1.25;
        var targetRate = Math.max(0.1, baselineRate - 0.02);

        var intervalHours = getIntervalHoursToNow(data);
        var amtInput = document.getElementById('amount');

        if (intervalHours === null || intervalHours < 0) {
          amtInput.value = '0,00';
          onTimeOrAmountInput();
          return;
        }

        var allowedTotalByInterval = targetRate * intervalHours;
        var last = data.lastDose;
        var netNeeded = allowedTotalByInterval;

        if (last && last.targetDoseAmount !== undefined) {
          var overage = (last.actualDoseAmount || 0) - last.targetDoseAmount;
          if (overage > 0) {
            netNeeded = allowedTotalByInterval - overage;
          }
        }

        var dateVal = document.getElementById('doseDate').value;
        var cap = getDoseCap(dateVal);
        if (netNeeded > cap) {
          netNeeded = cap;
        }

        var formattedDose = netNeeded.toFixed(2).replace('.', ',');
        amtInput.value = formattedDose;
        if (netNeeded < 0) {
          amtInput.style.color = '#ef5350';
        } else {
          amtInput.style.color = '#ffffff';
        }

        onTimeOrAmountInput();
      }

      function onTimeOrAmountInput() {
        var raw = document.getElementById('amount').value;
        var amountVal = getParsedAmount(raw);
        var previewBox = document.getElementById('livePreviewBox');
        var rateDisplayEl = document.getElementById('prevRateDisplay');

        if (amountVal <= 0 || !currentStatsData) {
          previewBox.style.display = 'none';
          return;
        }

        previewBox.style.display = 'block';

        var currentTotal = parseFloat(String(currentStatsData.dailyTotal).replace(' g', '').replace(',', '.')) || 0;
        var newTotal = currentTotal + amountVal;
        document.getElementById('prevTotal').innerText = newTotal.toFixed(2) + ' g';

        var last = currentStatsData.lastDose;
        if (last && last.amount) {
          var lastAmt = parseFloat(String(last.amount).replace(',', '.')) || 0;
          var diff = (amountVal - lastAmt).toFixed(2);
          var sign = diff > 0 ? '+' : '';
          document.getElementById('prevDiff').innerText = sign + diff + ' g';
        } else {
          document.getElementById('prevDiff').innerText = '-';
        }

        var intervalHours = getIntervalHoursToNow(currentStatsData);
        var currentSegmentRate = null;

        if (intervalHours && intervalHours > 0) {
          currentSegmentRate = parseFloat((amountVal / intervalHours).toFixed(2));
        }

        if (currentSegmentRate !== null && !isNaN(currentSegmentRate)) {
          var currentRecordedCount = 0;
          if (currentStatsData.allDoses) {
            for (var d = 0; d < currentStatsData.allDoses.length; d++) {
              if (currentStatsData.allDoses[d].hasData) currentRecordedCount++;
            }
          }
          var nextDoseNum = currentRecordedCount + 1;

          var baselineRate = null;
          var yMap = currentStatsData.yesterdayRates;
          if (yMap) {
            if (yMap[nextDoseNum] !== undefined) {
              baselineRate = parseFloat(yMap[nextDoseNum]);
            } else if (yMap[String(nextDoseNum)] !== undefined) {
              baselineRate = parseFloat(yMap[String(nextDoseNum)]);
            }
          }

          if (baselineRate !== null && !isNaN(baselineRate) && baselineRate > 0) {
            var baseFormatted = baselineRate.toFixed(2);
            var currentFormatted = currentSegmentRate.toFixed(2);

            if (currentSegmentRate <= baselineRate) {
              rateDisplayEl.innerHTML = `<span style="color: #81c784;">${currentFormatted}</span> <span style="color: #666;">/</span> <span style="color: #81c784;">${baseFormatted} g/h</span>`;
            } else {
              rateDisplayEl.innerHTML = `<span style="color: #ef5350;">${currentFormatted}</span> <span style="color: #666;">/</span> <span style="color: #888;">${baseFormatted} g/h</span>`;
            }
          } else {
            rateDisplayEl.innerHTML = `<span style="color: #a5d6a7;">${currentSegmentRate.toFixed(2)} g/h</span>`;
          }
        } else {
          rateDisplayEl.innerText = '-';
        }
      }

      function onWakeTimeChange() {
        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;
        var wakeVal = document.getElementById('wakeTime').value.trim();

        if (wakeVal && wakeVal.indexOf(':') === -1) return;

        callApi({
          action: 'saveWakeTime',
          sheetName: sheetName,
          dateStr: dateStr,
          wakeTime: wakeVal
        }, function(res) {
          if (res && res.success) {
            saveToLocalCache(sheetName, dateStr, res.stats);
            renderAllStats(res.stats);
          }
        }, function(err) {});
      }

      function autoSubmit() {
        if (isSaving) return;

        var amountInput = document.getElementById('amount');
        var amountVal = getParsedAmount(amountInput.value);

        if (amountVal <= 0) return;

        var cleanAmountString = String(amountVal).replace(',', '.');
        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;
        var time = document.getElementById('time').value.trim();
        var wakeTime = document.getElementById('wakeTime').value.trim();

        var recTarget = 0;
        if (currentStatsData) {
          var cCount = currentStatsData.allDoses ? currentStatsData.allDoses.filter(d => d.hasData).length : 0;
          var nNum = cCount + 1;
          var bRate = (currentStatsData.yesterdayRates && currentStatsData.yesterdayRates[nNum]) ? parseFloat(currentStatsData.yesterdayRates[nNum]) : 1.25;
          var tRate = Math.max(0.1, bRate - 0.02);
          var intH = getIntervalHoursToNow(currentStatsData);
          if (intH && intH > 0) {
            recTarget = Math.min(getDoseCap(dateStr), tRate * intH);
          }
        }

        isSaving = true;
        amountInput.value = '0,00';
        amountInput.style.color = '#ffffff';
        isUserModified = false;
        isManualTimeSet = false;
        document.getElementById('livePreviewBox').style.display = 'none';

        if (currentStatsData && currentStatsData.allDoses) {
          var valid = [];
          for (var i = 0; i < currentStatsData.allDoses.length; i++) {
            var d = currentStatsData.allDoses[i];
            if (d.hasData && getParsedAmount(d.amount) > 0 && d.time) {
              valid.push({ time: d.time, amount: getParsedAmount(d.amount) });
            }
          }
          valid.push({ time: time, amount: amountVal });
          valid.sort(function(a, b) { return a.time.localeCompare(b.time); });

          for (var k = 1; k <= 8; k++) {
            var tInp = document.getElementById('t_time_' + k);
            var aInp = document.getElementById('t_amount_' + k);
            if (k <= valid.length) {
              if (tInp) tInp.value = valid[k - 1].time;
              if (aInp) aInp.value = valid[k - 1].amount.toFixed(2).replace('.', ',');
            } else {
              if (tInp) tInp.value = '';
              if (aInp) aInp.value = '';
            }
          }

          lastRecordedTimeStr = time;
          var curTot = parseFloat(String(currentStatsData.dailyTotal).replace(' g', '').replace(',', '.')) || 0;
          currentStatsData.dailyTotal = (curTot + amountVal).toFixed(2) + ' g';
          currentStatsData.lastDose = {
            doseNumber: valid.length,
            time: time,
            amount: amountVal.toFixed(2),
            actualDoseAmount: amountVal,
            targetDoseAmount: recTarget,
            awakeTime: '-',
            diff: '-',
            rate: '-'
          };
          updateUpperCardsOnly(currentStatsData);
        }

        callApi({
          action: 'saveDose',
          sheetName: sheetName,
          dateStr: dateStr,
          time: time,
          amount: cleanAmountString,
          wakeTime: wakeTime,
          dayType: sheetName === 'Kori' ? activeDayType : ''
        }, function(res) {
          isSaving = false;
          if (res && res.success && res.stats) {
            if (currentStatsData && currentStatsData.lastDose) {
              res.stats.lastDose.actualDoseAmount = currentStatsData.lastDose.actualDoseAmount;
              res.stats.lastDose.targetDoseAmount = currentStatsData.lastDose.targetDoseAmount;
            }
            saveToLocalCache(sheetName, dateStr, res.stats);
            renderAllStats(res.stats);
          }
        }, function(err) {
          isSaving = false;
        });
      }

      function handleTableAmountKeydown(e, doseNum) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var aEl = document.getElementById('t_amount_' + doseNum);
          if (aEl) aEl.blur();
          return;
        }

        if (e.key === 'Backspace' || e.key === 'Delete') {
          var aEl = document.getElementById('t_amount_' + doseNum);
          var tEl = document.getElementById('t_time_' + doseNum);

          if (aEl && aEl.value.trim() !== '') {
            e.preventDefault();
            aEl.value = '';
            triggerTableDoseSync(doseNum);
            return;
          }

          if (aEl && aEl.value.trim() === '' && tEl && tEl.value.trim() !== '') {
            e.preventDefault();
            tEl.value = '';
            triggerTableDoseSync(doseNum);
            tEl.focus();
          }
        }
      }

      function triggerTableDoseSync(doseNum) {
        var tEl = document.getElementById('t_time_' + doseNum);
        var aEl = document.getElementById('t_amount_' + doseNum);

        normalizeTimeField(tEl);

        var timeVal = tEl ? tEl.value.trim() : '';
        var amtVal = aEl ? aEl.value.trim() : '';
        var cleanAmt = getParsedAmount(amtVal);

        if (currentStatsData && currentStatsData.allDoses) {
          var idx = doseNum - 1;
          if (idx >= 0 && idx < currentStatsData.allDoses.length) {
            currentStatsData.allDoses[idx].time = timeVal;
            currentStatsData.allDoses[idx].amount = cleanAmt > 0 ? cleanAmt.toFixed(2) : '';
            currentStatsData.allDoses[idx].hasData = (cleanAmt > 0 || timeVal !== '');

            var sumG = 0;
            var lastD = null;
            for (var i = 0; i < currentStatsData.allDoses.length; i++) {
              var d = currentStatsData.allDoses[i];
              var num = parseFloat(d.amount);
              if (!isNaN(num) && num > 0) {
                sumG += num;
                lastD = d;
              }
            }
            currentStatsData.dailyTotal = sumG.toFixed(2) + ' g';
            if (lastD) {
              lastRecordedTimeStr = lastD.time;
              currentStatsData.lastDose = lastD;
            } else {
              lastRecordedTimeStr = null;
              currentStatsData.lastDose = null;
            }

            updateUpperCardsOnly(currentStatsData);
            if (!isUserModified) {
              applyDoseRecommendation(currentStatsData);
            }
          }
        }

        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;

        callApi({
          action: 'saveSingleDoseSilent',
          sheetName: sheetName,
          dateStr: dateStr,
          doseNumber: doseNum,
          time: timeVal,
          amount: cleanAmt
        }, function(res) {
          if (res && res.success) {
            saveToLocalCache(sheetName, dateStr, res.stats);
            updateUpperCardsOnly(res.stats);
            if (!isUserModified) {
              applyDoseRecommendation(res.stats);
            }
          }
        }, function(err) {});
      }

      function commitAndSortTableDoses() {
        var activeEl = document.activeElement;
        if (activeEl && activeEl.id && (activeEl.id.startsWith('t_time_') || activeEl.id.startsWith('t_amount_'))) {
          return;
        }

        var dosesList = [];
        for (var i = 1; i <= 8; i++) {
          var tEl = document.getElementById('t_time_' + i);
          var aEl = document.getElementById('t_amount_' + i);
          var tVal = tEl ? tEl.value.trim() : '';
          var aVal = aEl ? aEl.value.trim() : '';
          var parsedA = getParsedAmount(aVal);
          if (parsedA > 0 && tVal && tVal.indexOf(':') !== -1) {
            dosesList.push({ time: tVal, amount: parsedA });
          }
        }

        dosesList.sort(function(a, b) {
          return a.time.localeCompare(b.time);
        });

        for (var k = 1; k <= 8; k++) {
          var tInp = document.getElementById('t_time_' + k);
          var aInp = document.getElementById('t_amount_' + k);
          if (k <= dosesList.length) {
            if (tInp) tInp.value = dosesList[k - 1].time;
            if (aInp) aInp.value = dosesList[k - 1].amount.toFixed(2).replace('.', ',');
          } else {
            if (tInp) tInp.value = '';
            if (aInp) aInp.value = '';
          }
        }

        if (currentStatsData) {
          var sumG = 0;
          var lastD = null;
          currentStatsData.allDoses = [];
          for (var j = 0; j < 8; j++) {
            if (j < dosesList.length) {
              sumG += dosesList[j].amount;
              var item = {
                doseNumber: j + 1,
                time: dosesList[j].time,
                amount: dosesList[j].amount.toFixed(2),
                hasData: true
              };
              lastD = item;
              currentStatsData.allDoses.push(item);
            } else {
              currentStatsData.allDoses.push({
                doseNumber: j + 1,
                time: '',
                amount: '',
                hasData: false
              });
            }
          }
          currentStatsData.dailyTotal = sumG.toFixed(2) + ' g';
          currentStatsData.lastDose = lastD;
          if (lastD) lastRecordedTimeStr = lastD.time;
          updateUpperCardsOnly(currentStatsData);
          if (!isUserModified) applyDoseRecommendation(currentStatsData);
        }

        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;

        callApi({
          action: 'saveAllTableDoses',
          sheetName: sheetName,
          dateStr: dateStr,
          dosesJson: JSON.stringify(dosesList)
        }, function(res) {
          if (res && res.success && res.stats) {
            saveToLocalCache(sheetName, dateStr, res.stats);
            updateUpperCardsOnly(res.stats);
            if (!isUserModified) applyDoseRecommendation(res.stats);
          }
        }, function(err) {});
      }

      function saveToLocalCache(sheetName, dateStr, data) {
        try {
          localStorage.setItem('taper_fast_cache_v3_' + sheetName + '_' + dateStr, JSON.stringify(data));
        } catch(e) {}
      }

      function loadStats() {
        var sheetName = document.getElementById('sheetName').value;
        var dateStr = document.getElementById('doseDate').value;
        document.getElementById('dateSubtitle').innerText = dateStr;

        var cacheKey = 'taper_fast_cache_v3_' + sheetName + '_' + dateStr;
        var hasCachedData = false;

        try {
          var cached = localStorage.getItem(cacheKey);
          if (cached) {
            var parsed = JSON.parse(cached);
            if (parsed && parsed.found) {
              currentStatsData = parsed;
              renderAllStats(parsed);
              hasCachedData = true;
            }
          }
        } catch(e) {}

        if (!hasCachedData) {
          document.getElementById('lastDoseStatsContent').innerHTML = '<div class="loading">Loading...</div>';
          document.getElementById('summaryStatsContent').innerHTML = '<div class="loading">Loading...</div>';
          document.getElementById('editableDosesContent').innerHTML = '<div class="loading">Loading...</div>';
        }

        callApi({
          action: 'getStats',
          sheetName: sheetName,
          dateStr: dateStr
        }, function(data) {
          if (!data || !data.found) {
            if (!hasCachedData) {
              currentStatsData = null;
              document.getElementById('lastDoseStatsContent').innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 8px;">No previous dose.</div>';
              document.getElementById('summaryStatsContent').innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 8px;">No entries for this day.</div>';
              document.getElementById('editableDosesContent').innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 8px;">No data.</div>';
            }
            return;
          }
          currentStatsData = data;
          saveToLocalCache(sheetName, dateStr, data);
          renderAllStats(data);
        }, function(err) {
          if (!hasCachedData) {
            document.getElementById('lastDoseStatsContent').innerHTML = '';
            document.getElementById('summaryStatsContent').innerHTML = '<div style="color: #e57373; font-size: 12px; padding: 8px;">Error: ' + err.message + '</div>';
            document.getElementById('editableDosesContent').innerHTML = '';
          }
        });
      }

      function updateUpperCardsOnly(data) {
        currentStatsData = data;
        var last = data.lastDose;
        var lastCard = document.getElementById('lastDoseStatsContent');
        var timeLabel = document.getElementById('lastDoseTimeLabel');

        if (!last) {
          timeLabel.innerText = '';
          lastCard.innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 8px;">No doses logged today.</div>';
          lastRecordedTimeStr = null;
        } else {
          timeLabel.innerText = '#' + last.doseNumber + ' (' + last.time.substring(0, 5) + ' - ' + last.amount + 'g)';
          lastRecordedTimeStr = last.time;

          lastCard.innerHTML = `
            <div class="stat-row"><span class="stat-label">Elapsed</span><span id="liveElapsedDisplay" class="stat-value highlight-value">Calculating...</span></div>
            <div class="stat-row"><span class="stat-label">Awake</span><span class="stat-value">${last.awakeTime}</span></div>
            <div class="stat-row"><span class="stat-label">Diff</span><span class="stat-value">${last.diff}</span></div>
            <div class="stat-row"><span class="stat-label">Rate</span><span class="stat-value">${last.rate}</span></div>
          `;
          updateLiveElapsedTime();
        }

        document.getElementById('summaryStatsContent').innerHTML = `
          <div class="stat-row"><span class="stat-label">Total</span><span class="stat-value">${data.dailyTotal}</span></div>
          <div class="stat-row"><span class="stat-label">Average</span><span class="stat-value">${data.avgDose}</span></div>
          <div class="stat-row"><span class="stat-label">Diff</span><span class="stat-value">${data.avgDiff}</span></div>
          <div class="stat-row"><span class="stat-label">Rate</span><span class="stat-value">${data.avgRate}</span></div>
          <div class="stat-row"><span class="stat-label">Max</span><span class="stat-value">${data.maxDose}</span></div>
          <div class="stat-row"><span class="stat-label">Count</span><span class="stat-value">${data.totalDoses}</span></div>
          <div class="stat-row"><span class="stat-label">Interval</span><span class="stat-value">${data.avgInterval}</span></div>
        `;
      }

      function renderAllStats(data) {
        updateUpperCardsOnly(data);

        if (data.wakeTime) {
          document.getElementById('wakeTime').value = data.wakeTime;
        }

        if (data.dayType) {
          activeDayType = (data.dayType.toLowerCase() === 'munkanap' || data.dayType.toLowerCase() === 'dolgozós') ? 'Munkanap' : 'Szabadnap';
          document.getElementById('btnSzabadnap').className = 'day-type-btn' + (activeDayType === 'Szabadnap' ? ' active' : '');
          document.getElementById('btnMunkanap').className = 'day-type-btn' + (activeDayType === 'Munkanap' ? ' active' : '');
        }

        var activeEl = document.activeElement;
        var isEditingTable = activeEl && activeEl.id && (activeEl.id.startsWith('t_time_') || activeEl.id.startsWith('t_amount_'));
        if (isEditingTable) {
          return;
        }

        var doses = data.allDoses || [];
        var tableHtml = `
          <table class="doses-table">
            <tbody>
        `;

        for (var i = 0; i < doses.length; i++) {
          var item = doses[i];
          tableHtml += `
            <tr>
              <td style="color: #666; font-size: 12px; font-weight: 500; text-align: center; width: 34px; padding-left: 2px; padding-right: 6px;">${item.doseNumber}</td>
              <td style="width: 48%; padding-right: 4px;">
                <input 
                  type="text" 
                  id="t_time_${item.doseNumber}" 
                  class="table-input" 
                  maxlength="5" 
                  inputmode="numeric" 
                  enterkeyhint="done"
                  placeholder="00:00" 
                  value="${item.time}" 
                  oninput="onTableTimeInputAuto(this, ${item.doseNumber})" 
                  onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
                  onblur="normalizeTimeField(this); triggerTableDoseSync(${item.doseNumber});"
                >
              </td>
              <td style="width: 48%; padding-left: 4px;">
                <input 
                  type="text" 
                  id="t_amount_${item.doseNumber}" 
                  class="table-input" 
                  inputmode="numeric" 
                  enterkeyhint="done"
                  placeholder="0,00" 
                  value="${item.amount ? item.amount.replace('.', ',') : ''}" 
                  oninput="formatAmountInput(this); triggerTableDoseSync(${item.doseNumber});" 
                  onkeydown="handleTableAmountKeydown(event, ${item.doseNumber})" 
                  onblur="triggerTableDoseSync(${item.doseNumber})"
                >
              </td>
            </tr>
          `;
        }

        tableHtml += `
            </tbody>
          </table>
        `;

        document.getElementById('editableDosesContent').innerHTML = tableHtml;
        applyDoseRecommendation(data);
      }

      function updateLiveElapsedTime() {
        var el = document.getElementById('liveElapsedDisplay');
        if (!el || !lastRecordedTimeStr) return;

        var now = new Date();
        var parts = lastRecordedTimeStr.split(':');
        if (parts.length < 2) return;

        var lastHour = parseInt(parts[0], 10);
        var lastMin = parseInt(parts[1], 10);

        var lastDate = new Date();
        lastDate.setHours(lastHour, lastMin, 0, 0);

        var diffMs = now.getTime() - lastDate.getTime();
        if (diffMs < 0) {
          diffMs += 24 * 60 * 60 * 1000;
        }

        var totalMinutes = Math.floor(diffMs / (1000 * 60));
        var hours = Math.floor(totalMinutes / 60);
        var mins = totalMinutes % 60;

        if (hours === 0) {
          el.innerText = mins + ' min';
        } else {
          el.innerText = hours + ' h ' + String(mins).padStart(2, '0') + ' min';
        }
      }
    </script>
  </body>
</html>
